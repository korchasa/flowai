# [REF:fr:cicd | FR-CICD], FR-CICD.PIN, FR-CICD.PRIV, FR-CICD.INTEGRITY, FR-CICD.JOBS
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.9.1

      - name: Verify file integrity after setup
        run: |
          git diff --exit-code || { echo "::error::Unexpected file modifications after setup"; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard)" ] || { echo "::error::Unexpected untracked files after setup"; exit 1; }

      - name: Run checks
        run: deno task check

      - name: Verify file integrity after checks
        run: |
          git diff --exit-code || { echo "::error::Unexpected file modifications after checks"; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard)" ] || { echo "::error::Unexpected untracked files after checks"; exit 1; }

  release:
    needs: check
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.9.1

      - name: Determine releasable
        id: releasable
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            COMMITS=$(git log --oneline ${LATEST_TAG}..HEAD --grep="^feat\|^fix\|^perf\|^break\|^refactor\|^build" | wc -l)
            [ "$COMMITS" -gt 0 ] && echo "should_release=true" >> $GITHUB_OUTPUT || { echo "Nothing to release"; echo "should_release=false" >> $GITHUB_OUTPUT; }
          fi

      - name: Create release
        id: create-release
        if: steps.releasable.outputs.should_release == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          deno run -A npm:standard-version
          NEW_VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          NEW_TAG="v${NEW_VERSION}"
          NOTES_FILE=$(mktemp)
          deno run -A scripts/generate-release-notes.ts "$LATEST_TAG" "$NEW_TAG" "${{ github.repository }}" > "$NOTES_FILE"
          git push --follow-tags origin main
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "notes_file=${NOTES_FILE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.releasable.outputs.should_release == 'true'
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: v${{ steps.create-release.outputs.version }}
          body_path: ${{ steps.create-release.outputs.notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build shared Claude Code + Codex plugin marketplace tree, validate it, then
      # publish to downstream repo korchasa/flowai-plugins on the same release
      # event. Validation is a pre-publish gate: any schema / cross-link /
      # frontmatter issue aborts the run BEFORE the downstream is touched.
      # implements [REF:fr:dist.marketplace | FR-DIST.MARKETPLACE]
      - name: Build and validate plugin marketplace
        if: steps.releasable.outputs.should_release == 'true'
        run: deno task validate-plugins

      - name: Checkout flowai-plugins (downstream)
        if: steps.releasable.outputs.should_release == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: korchasa/flowai-plugins
          ssh-key: ${{ secrets.FLOWAI_PLUGINS_DEPLOY_KEY }}
          path: downstream

      - name: Sync generated artefacts to downstream
        if: steps.releasable.outputs.should_release == 'true'
        env:
          TAG: framework-v${{ steps.create-release.outputs.version }}
        run: |
          set -euo pipefail
          # Preserve hand-authored files (README.md, LICENSE, .git) and
          # replace every other top-level entry with the freshly built tree.
          find downstream -mindepth 1 -maxdepth 1 \
            ! -name README.md ! -name LICENSE ! -name .git -exec rm -rf {} +
          cp -r dist/claude-plugins/. downstream/
          cd downstream
          git config user.name 'flowai-release-bot'
          git config user.email 'release-bot@flowai.local'
          git add -A
          if git diff --cached --quiet; then
            echo "No artefact changes; skipping commit."
          else
            git commit -m "release: ${TAG}"
          fi
          # Tag may already exist on a re-run; replace it and force-push the ref.
          git tag -f "${TAG}"
          git push origin main
          git push --force-with-lease origin "refs/tags/${TAG}"
